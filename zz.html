<!DOCTYPE html>
<html lang="en">
<head>
    <title>Practice-02</title>
    <style>
        .container{
        display:grid;
        grid-template-columns:auto auto auto auto;
        grid-template-rows:auto auto auto auto;
        gap:10px;
        background-color: blue;
        padding:10px;
        }
        .container p{
            background-color:aliceblue;
            border:8px solid blue;
            margin:0;
            display:flex;
            align-items:center;
            justify-content:center;
            text-align:center;
            min-height:100px;
        }
        </style>
</head>
<body>
    <div class="container">
       <p style="grid-column:1; grid-row:1/3;">Masonry I</p>
       <p style="grid-column:2; grid-row:1;">Responsive</p>
       <p style="grid-column:3/5; grid-row:1;">Overlap</p>

       <p style="grid-column:2; grid-row:2;">Fluid</p>
       <p style="grid-column:3; grid-row:2/4;">Explicitly Placed</p>
       <p style="grid-column:4; grid-row:2;">Negative Space</p>

       <p style="grid-column:1; grid-row:3;">Flexible Breadth</p>
       <p style="grid-column:2; grid-row:3/5;">Masonry II</p>
       <p style="grid-column:4; grid-row:3;">Masonry III</p>

       <p style="grid-column:1; grid-row:4;">DOM Order</p>
       <p style="grid-column:3/5; grid-row:4;">Named Tracks</p>
    </div>
</body>
</html>
