<!DOCTYPE html>
<html lang="en">
<head>
    
    <title>Document</title>
    <style>
        .container{
            display:grid;
            grid-template-rows:auto auto auto auto;
            grid-template-columns:auto auto auto ;
            background:white;
            margin:0px;
            gap:10px;
        }
        .container p{
           
            margin:0px;
            text-align:center;
            align-items:center;
            justify-content:center;
            color:white;
            font-weight:bold;
            padding:40px 0;
        }
        
        
    </style>
</head>
<body>
    <div class="container">
        <p class="HEADER" style="background-color:orangered;grid-column:1/4;grid-row:1;PADDING:8PX">HEADER</p>
        <p style="background-color:orange;grid-column:1;grid-row:2/4;">SIDEBAR</p>
        <p style="background-color:orangered;grid-column:2/4;grid-row:2">CONTENT</p>
        <p style="background-color:violet;grid-column:2;grid-row:3">CONTENT7</p>
        <p style="background-color:violet;grid-column:3;grid-row:3">CONTENT3</p>
        <p style="background-color:orange;grid-column:1/4;grid-row:4;PADDING:8PX">FOOTER</p>
    </div>
    
</body>
</html>
