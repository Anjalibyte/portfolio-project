<!DOCTYPE html>
<html lang="en">
<head>
    
   
    <title>Document</title>
    <style>
        .container{
        display:grid;
        grid-template-columns:auto auto auto auto;
        grid-template-rows:auto auto auto auto;
        gap:0px;
        background-color: blue;
        padding:10px;
         
        }
        .container p{
            background-color:aliceblue;
            border:8px solid blue;
            margin:0px;
            align-items:center;
            justify-content:center;
            text-align:center;
            display:flex;
            min-height:100px;
        }
        </style>
</head>
<body>
    <div class="container">
       <p style="grid-column:1;grid-row:1/3;">1</p>
       <p style="grid-column:2;grid-row:1;">2</p>
       <p style="grid-column:3/5;grid-row:1;">3</p>
       <p style="grid-column:2;grid-row:2;">4</p>
       <p style="grid-column:3;grid-row:2/4">5</p>
       <p style="grid-column:4;grid-row:2">6</p>
       <p style="grid-column:1;grid-row:3">7</p>
       <p style="grid-column:2;grid-row:3/5">8</p>
       <p style="grid-column:4;grid-row:3">9</p>
       <p style="grid-column:1;grid-row:4">10</p>
       <p style="grid-column:3/5;grid-row:4">11</p>
       
    </div>
    
</body>
</html>
