<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Hallbooking- Login</title>

    <link rel="stylesheet" href="login.css">
    
</head>

<body>

    <div class="login-container">

        <!-- Left Side -->
        <div class="welcome-section">

            <h1>Hallbooking</h1>

            <h2>Smart Campus Event & Resource Management</h2>

            <p>
                Manage halls, resources, staff and events
                efficiently from one platform.
            </p>

        </div>


        <!-- Right Side -->
        <div class="login-section">

            <h2>Welcome Back</h2>

            <p class="login-text">
                Login to continue
            </p>


            <form id="loginForm">

                <!-- Email -->
                <label for="email">Email Address</label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required
                >


                <!-- Password -->
                <label for="password">Password</label>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    required
                >


                <!-- Role -->
                <label for="role">Login As</label>

                <select id="role" required>

                    <option value="">
                        Select your role
                    </option>

                    <option value="organizer">
                        Event Organizer
                    </option>

                    <option value="resource-manager">
                        Hall & Resource Manager
                    </option>

                    <option value="staff-manager">
                        Staff Manager
                    </option>

                    <option value="admin">
                        Administrator
                    </option>

                </select>


                <!-- Login Button -->
                <button type="submit">
                    Login
                </button>

            </form>

            <p id="message"></p>

        </div>

    </div>


    <script src="login.js"></script>

</body>

</html>
